<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#161a2e;--mute:#7b819a;--line:#e6e8f3;--ok:#16a34a;--okbg:#ecfbf1;--late:#e11d48;--shadow:0 8px 24px rgba(40,40,100,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:#171a2d;--text:#eef0fa;--mute:#8d93b0;--line:#262a42;--ok:#4ade80;--okbg:#10291b;--shadow:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:#171a2d;--text:#eef0fa;--mute:#8d93b0;--line:#262a42;--ok:#4ade80;--okbg:#10291b;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:500px;margin:0 auto;padding:14px 14px 110px}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:22px 20px 18px;background:linear-gradient(140deg,#1e1b4b,#4338ca 55%,#7c3aed);box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:180px;height:180px;right:-50px;top:-70px}.hero:after{width:120px;height:120px;left:-40px;bottom:-60px}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hi{font-size:14px;opacity:.85}
.hero h1{margin:4px 0 6px;font-size:26px;letter-spacing:-.5px}
.sum{font-size:14px;opacity:.9}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.week{position:relative;display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;opacity:.9;flex:1}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:12px}
.dot.on{background:#fff;color:#4338ca;border-color:#fff;font-weight:800}
.dot.today{border-color:#fff}
.streak{position:relative;margin-top:12px;font-size:13px;opacity:.95}
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.sec small{font-weight:500;letter-spacing:0;text-transform:none;opacity:.8}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);border-left:6px solid var(--c);transition:.25s}
.card.done{background:var(--okbg);border-left-color:var(--ok)}
.card.late{box-shadow:0 0 0 2px var(--late),var(--shadow)}
.ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent)}
.info{flex:1;min-width:0}
.name{font-size:16px;font-weight:650;word-break:break-word}
.st{font-size:12.5px;color:var(--mute);margin-top:3px}
.done .st{color:var(--ok);font-weight:600}.late .st{color:var(--late);font-weight:600}
.del{background:none;border:0;color:var(--mute);font-size:15px;padding:8px 4px;opacity:.55;cursor:pointer}
.take{flex:none;border:0;cursor:pointer;font-weight:700;font-size:14px;color:#fff;background:var(--c);border-radius:999px;padding:12px 18px;transition:transform .12s}
.take:active{transform:scale(.93)}
.card.done .take{width:44px;height:44px;padding:0;background:var(--ok);display:grid;place-items:center;animation:pop .35s}
.card.done .take svg{display:block}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.empty{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.6}
.empty .big{font-size:46px;margin-bottom:6px}
.fab{position:fixed;right:max(18px,calc(50% - 232px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;color:#fff;font-size:32px;line-height:1;background:linear-gradient(140deg,#4338ca,#7c3aed);box-shadow:0 10px 26px rgba(67,56,202,.5);cursor:pointer}
.bg{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.bg.open{display:flex}
.sheet{width:100%;max-width:500px;background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 14px;font-size:19px}
.sheet label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.sheet input{width:100%;padding:13px;font-size:16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--text);outline:none}
.sheet input:focus{border-color:#6d5cff}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{width:42px;height:42px;border-radius:13px;border:2px solid var(--line);background:transparent;font-size:20px;cursor:pointer;padding:0}
.pick button.sel{border-color:var(--text);transform:scale(1.08)}
.pick.col button{border-radius:50%;border:3px solid transparent}
.pick.col button.sel{border-color:var(--text)}
.save{width:100%;margin-top:20px;padding:15px;font-size:16px;font-weight:700;border:0;border-radius:16px;color:#fff;background:linear-gradient(140deg,#4338ca,#7c3aed);cursor:pointer}
.conf{position:fixed;top:-30px;font-size:24px;z-index:20;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
</style>
</head>
<body>
<main>
<div class="hero">
 <div class="top"><div><div class="hi" id="hi"></div><h1 id="date"></h1><div class="sum" id="sum"></div></div>
 <div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="35" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle id="arc" cx="42" cy="42" r="35" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="219.9" stroke-dashoffset="219.9" style="transition:stroke-dashoffset .6s"/></svg><b id="cnt"></b></div></div>
 <div class="week" id="week"></div>
 <div class="streak" id="streak"></div>
</div>
<div id="list"></div>
</main>
<button class="fab" id="fab" aria-label="İlaç ekle">+</button>
<div class="bg" id="bg"><div class="sheet">
 <h2>Yeni ilaç</h2>
 <label for="inp">İlaç adı</label><input id="inp" maxlength="40" placeholder="Örn. Sabah vitamini">
 <label for="tm">Saat (isteğe bağlı)</label><input id="tm" type="time">
 <label>İkon</label><div class="pick" id="icons"></div>
 <label>Renk</label><div class="pick col" id="cols"></div>
 <button class="save" id="addb">Ekle</button>
</div></div>
<script>
var KEY="ilac-v1",HK="ilac-hist",items=[],hist={},ICONS=["💊","💉","🧴","🍃","🌙","☀️","❤️","🩹"],COLS=["#4f6bff","#7c4dff","#e11d48","#f59e0b","#0891b2","#db2777"],selI=0,selC=0,wasAll=false;
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){items=[]}
try{hist=JSON.parse(localStorage.getItem(HK)||"{}")||{}}catch(e){hist={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(HK,JSON.stringify(hist))}catch(e){}}
function dk(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function active(it){return !!it.t&&new Date(it.t).toDateString()===new Date().toDateString()}
function tm(t){return new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}
function left(){var n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),x=Math.ceil((m-n)/60000);return Math.floor(x/60)+" sa "+x%60+" dk"}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function late(it){if(active(it)||!it.h)return false;var n=new Date(),p=it.h.split(":");return n.getHours()*60+n.getMinutes()>+p[0]*60+ +p[1]}
function grp(it){if(!it.h)return 4;var h=+it.h.split(":")[0];return h>=5&&h<12?0:h>=12&&h<17?1:h>=17&&h<21?2:3}
var GN=[["Sabah","05:00 – 11:59"],["Öğle","12:00 – 16:59"],["Akşam","17:00 – 20:59"],["Gece","21:00 – 04:59"],["Gün içinde","saat belirtilmemiş"]];
var CHECK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function burst(){var e=["🎉","✨","💊","⭐","💚"];for(var i=0;i<18;i++){var s=document.createElement("span");s.className="conf";s.textContent=e[i%5];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},2600,s)}}
function render(){
 var d=items.filter(active).length,n=items.length,now=new Date(),H=now.getHours();
 document.getElementById("hi").textContent=H<5?"İyi geceler":H<12?"Günaydın":H<18?"İyi günler":"İyi akşamlar";
 document.getElementById("date").textContent=now.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
 document.getElementById("cnt").textContent=d+"/"+n;
 document.getElementById("sum").textContent=!n?"İlk ilacını ekleyerek başla":d===n?"Bugünkü tüm ilaçlar tamam 🎉":(n-d)+" ilaç bekliyor";
 document.getElementById("arc").style.strokeDashoffset=219.9*(1-(n?d/n:0));
 var all=n>0&&d===n;if(all)hist[dk(now)]=1;else delete hist[dk(now)];
 if(all&&!wasAll&&window._user)burst();wasAll=all;
 var w="",st=0,i,x;
 for(i=6;i>=0;i--){x=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);w+='<div class="wd"><span>'+x.toLocaleDateString("tr-TR",{weekday:"short"}).slice(0,3)+'</span><div class="dot'+(hist[dk(x)]?' on':'')+(i===0?' today':'')+'">'+(hist[dk(x)]?'✓':'')+'</div></div>'}
 document.getElementById("week").innerHTML=w;
 for(i=hist[dk(now)]?0:1;i<400;i++){if(hist[dk(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i))])st++;else break}
 document.getElementById("streak").textContent=st>0?"🔥 "+st+" gün üst üste tamamladın":"Tüm ilaçları içtiğin günler burada işaretlenir";
 var el=document.getElementById("list");
 if(!n){el.innerHTML='<div class="empty"><div class="big">💊</div>Henüz ilaç yok.<br>Sağ alttaki <b>+</b> ile ekleyebilirsin.</div>';save();return}
 var idx=items.map(function(_,k){return k}).sort(function(a,b){var p=grp(items[a])-grp(items[b]);if(p)return p;var s=items[a].h||"",t=items[b].h||"";return s<t?-1:s>t?1:a-b}),out="",cur=-1;
 idx.forEach(function(k){var it=items[k],g=grp(it),a=active(it),l=late(it);
  if(g!==cur){cur=g;out+='<div class="sec">'+GN[g][0]+'<small>'+GN[g][1]+'</small></div>'}
  var s=a?'İçildi · '+tm(it.t)+' · sıfırlanmaya '+left():l?'Gecikti · '+it.h:it.h?'Saat '+it.h:'Henüz içilmedi';
  out+='<div class="card'+(a?' done':l?' late':'')+'" style="--c:'+(it.c||COLS[0])+'"><div class="ic">'+(it.i||"💊")+'</div><div class="info"><div class="name">'+esc(it.n)+'</div><div class="st">'+s+'</div></div><button class="del" data-d="'+k+'" aria-label="Sil">🗑</button><button class="take" data-b="'+k+'" aria-label="'+(a?"Geri al":"İçtim")+'">'+(a?CHECK:"İçtim")+'</button></div>'});
 el.innerHTML=out;save()}
function pickers(){
 document.getElementById("icons").innerHTML=ICONS.map(function(x,k){return '<button data-i="'+k+'" class="'+(k===selI?'sel':'')+'">'+x+'</button>'}).join("");
 document.getElementById("cols").innerHTML=COLS.map(function(x,k){return '<button data-c="'+k+'" style="background:'+x+'" class="'+(k===selC?'sel':'')+'"></button>'}).join("")}
function openS(o){document.getElementById("bg").classList.toggle("open",o);if(o)setTimeout(function(){document.getElementById("inp").focus()},150)}
document.addEventListener("click",function(e){
 var t=e.target.closest("button,.bg");if(!t)return;
 if(t.id==="fab")return openS(true);
 if(t.id==="bg"&&e.target===t)return openS(false);
 var b=t.getAttribute("data-b"),d=t.getAttribute("data-d"),pi=t.getAttribute("data-i"),pc=t.getAttribute("data-c");
 if(b!==null){window._user=1;var it=items[b];it.t=active(it)?0:Date.now();render()}
 else if(d!==null){if(confirm('"'+items[d].n+'" silinsin mi?')){items.splice(d,1);render()}}
 else if(pi!==null){selI=+pi;pickers()}
 else if(pc!==null){selC=+pc;pickers()}
 else if(t.id==="addb")add()});
function add(){var i=document.getElementById("inp"),v=i.value.trim();if(!v){i.focus();return}
 items.push({n:v,t:0,h:document.getElementById("tm").value,i:ICONS[selI],c:COLS[selC]});
 i.value="";document.getElementById("tm").value="";openS(false);render()}
document.getElementById("inp").onkeydown=function(e){if(e.key==="Enter")add()};
document.addEventListener("visibilitychange",render);
pickers();render();setInterval(render,30000);
</script>
</body>
</html>
